<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Fondos y efectos -->
  <defs>
    <!-- Degradado del fondo -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ff4fa3" stop-opacity="0.35"></stop>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"></stop>
    </radialGradient>

    <!-- Efecto de brillo rosado -->
    <filter id="pinkGlow">
      <feGaussianBlur stdDeviation="7" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Círculo exterior -->
  <circle cx="110" cy="110" r="100" fill="url(#bg)" stroke="#ff4fa3" stroke-width="2" opacity="0.9"></circle>

  <!-- Decoración de corazones suaves -->
  <text x="50" y="60" font-size="26" fill="#ff4fa3" opacity="0.35">❤</text>
  <text x="160" y="160" font-size="22" fill="#ff4fa3" opacity="0.28">❤</text>
  <text x="145" y="45" font-size="18" fill="#ff4fa3" opacity="0.25">❤</text>

  <!-- Letra V principal -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="central" font-family="Georgia, serif" font-size="130" fill="#ff4fa3" style="font-weight: 900; letter-spacing: 4px;" filter="url(#pinkGlow)">
      V
  </text>
</svg>
